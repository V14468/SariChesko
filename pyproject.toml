[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sarichesko"
version = "0.1.0"
description = "Cross-platform desktop network-congestion diagnosis and traffic mitigation testbed"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Vedaditya" }
]
dependencies = [
    "PySide6>=6.5.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
sarichesko = "sarichesko.app:main"

[tool.setuptools.packages.find]
include = ["sarichesko*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
